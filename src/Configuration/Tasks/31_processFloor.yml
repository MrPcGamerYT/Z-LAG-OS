title: ULTRA Idle Process + RAM Floor (persistent)
description: Consolidates svchost pools, disables an expanded Windows 10/11 non-gaming service set, removes its trigger-start metadata, trims working sets, then installs a brief non-resident SYSTEM watchdog at boot/logon/every 15 minutes. Core RPC, networking, audio, logon, security and AppX launch services stay hard-protected.
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Applying ULTRA Idle Process + RAM Floor..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\process_floor.ps1'
  - !writeStatus: {status: "Locking the service floor across later boots and logons..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\enforce_service_floor.ps1'
  - !writeStatus: {status: "Persistent idle service/process floor installed."}
