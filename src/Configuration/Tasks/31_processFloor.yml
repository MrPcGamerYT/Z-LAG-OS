title: ULTRA Idle Process + RAM Floor (persistent)
description: Consolidates svchost pools, disables safe non-gaming services and on-demand features, trims working sets, then installs a brief non-resident SYSTEM watchdog at boot/logon/every 15 minutes. This prevents trigger-start and per-user service instances from raising idle process count after the first boot while hard-protecting Windows core, networking, audio and AppX launch services.
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Applying ULTRA Idle Process + RAM Floor..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\process_floor.ps1'
  - !writeStatus: {status: "Locking the service floor across later boots and logons..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\enforce_service_floor.ps1'
  - !writeStatus: {status: "Persistent idle service/process floor installed."}
