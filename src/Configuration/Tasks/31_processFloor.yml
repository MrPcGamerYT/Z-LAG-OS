title: ULTRA Idle Process + RAM Floor
description: ULTRA pass - consolidates svchost pools, disables every safe-to-remove background service PLUS on-demand features (System Restore/VSS, notifications, network discovery, file sharing, hotspot), trims working sets and prefetch to push idle processes and RAM to the absolute floor. Hard-protects the Windows core, Wi-Fi, Bluetooth, Ethernet and the AppX shell/app-launch stack so the OS boots and apps still launch. Edge and WebView2 are intentionally not protected.
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Applying ULTRA Idle Process + RAM Floor..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\process_floor.ps1'
  - !writeStatus: {status: "Idle process + RAM floor applied. Reboot will lock in the minimal footprint."}
