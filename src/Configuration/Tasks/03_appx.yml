title: Removing Bloat Apps
description: Removes AppX bloat packages using AME's native appx action (deprovisions + removes for all users). GPU drivers, the Windows shell, WebView2 and critical system apps are NOT listed, so they are never touched.
privilege: TrustedInstaller
onUpgrade: false
actions:
  - !writeStatus: {status: "Removing AppX packages - keeping GPU drivers and critical system apps"}

  # Each package is removed by family name via AME's native action, which
  # handles per-user + provisioned removal correctly (no hand-rolled PowerShell,
  # no 0x80070002 DeStage errors).
  - !appx: {name: 'Microsoft.Windows.SecureAssessmentBrowser*', type: family}
  - !appx: {name: 'Microsoft.Windows.PeopleExperienceHost*', type: family}
  - !appx: {name: 'Microsoft.WindowsCamera*', type: family}
  - !appx: {name: 'MicrosoftWindows.Client.WebExperience*', type: family}
  - !appx: {name: 'Microsoft.WidgetsPlatformRuntime*', type: family}
  - !appx: {name: 'Microsoft.WindowsAlarms*', type: family}
  - !appx: {name: 'Microsoft.WindowsMaps*', type: family}
  - !appx: {name: 'Microsoft.MicrosoftStickyNotes*', type: family}
  - !appx: {name: 'microsoft.windowscommunicationsapps*', type: family}
  - !appx: {name: 'Microsoft.People*', type: family}
  - !appx: {name: 'Microsoft.BingNews*', type: family}
  - !appx: {name: 'Microsoft.BingSearch*', type: family}
  - !appx: {name: 'Microsoft.BingWeather*', type: family}
  - !appx: {name: 'Microsoft.MicrosoftSolitaireCollection*', type: family}
  - !appx: {name: 'Microsoft.WindowsFeedbackHub*', type: family}
  - !appx: {name: 'Microsoft.GetHelp*', type: family}
  - !appx: {name: 'Microsoft.Getstarted*', type: family}
  - !appx: {name: 'Microsoft.Todos*', type: family}
  - !appx: {name: 'Microsoft.PowerAutomateDesktop*', type: family}
  - !appx: {name: 'Microsoft.549981C3F5F10*', type: family}
  - !appx: {name: 'MicrosoftCorporationII.QuickAssist*', type: family}
  - !appx: {name: 'MicrosoftCorporationII.MicrosoftFamily*', type: family}
  - !appx: {name: 'Microsoft.ZuneMusic*', type: family}
  - !appx: {name: 'Microsoft.ZuneVideo*', type: family}
  - !appx: {name: 'Microsoft.WindowsSoundRecorder*', type: family}
  - !appx: {name: 'Clipchamp.Clipchamp*', type: family}
  - !appx: {name: 'Microsoft.Whiteboard*', type: family}
  - !appx: {name: 'Microsoft.MicrosoftTeamsforSurfaceHub*', type: family}
  - !appx: {name: 'MicrosoftCorporationII.MailforSurfaceHub*', type: family}
  - !appx: {name: 'Microsoft.MicrosoftPowerBIForWindows*', type: family}
  - !appx: {name: 'Microsoft.SkypeApp*', type: family}
  - !appx: {name: 'Microsoft.MicrosoftOfficeHub*', type: family}
  - !appx: {name: 'Microsoft.Office.Excel*', type: family}
  - !appx: {name: 'Microsoft.Office.PowerPoint*', type: family}
  - !appx: {name: 'Microsoft.Office.Word*', type: family}
  - !appx: {name: 'Microsoft.Office.OneNote*', type: family}
  - !appx: {name: 'Microsoft.OutlookForWindows*', type: family}
  - !appx: {name: 'SpotifyAB.SpotifyMusic*', type: family}
  - !appx: {name: 'OutlookPWA*', type: family}
  - !appx: {name: 'Microsoft.Microsoft3DViewer*', type: family}
  - !appx: {name: 'Microsoft.Advertising.Xaml*', type: family}
  - !appx: {name: 'MixedReality.Portal*', type: family}
  - !appx: {name: 'Microsoft.MSPaint*', type: family}
  - !appx: {name: 'Microsoft.Copilot*', type: family}
  - !appx: {name: 'MicrosoftTeams*', type: family}
  - !appx: {name: 'MSTeams*', type: family}
  - !appx: {name: 'Disney.37853FC22B2CE*', type: family}
  - !appx: {name: 'Netflix*', type: family}
  - !appx: {name: 'Microsoft.XboxApp*', type: family}
  - !appx: {name: 'Microsoft.XboxGamingOverlay*', type: family}
  - !appx: {name: 'Microsoft.XboxIdentityProvider*', type: family}
  - !appx: {name: 'Microsoft.XboxSpeechToTextOverlay*', type: family}
  - !appx: {name: 'Microsoft.Xbox.TCUI*', type: family}
  - !appx: {name: 'Microsoft.XboxGameCallableUI*', type: family}
  - !appx: {name: 'Microsoft.GamingApp*', type: family}
  - !appx: {name: 'Microsoft.YourPhone*', type: family}
  - !appx: {name: 'MicrosoftWindows.CrossDevice*', type: family}
  - !appx: {name: 'Microsoft.WindowsCalculator*', type: family}
  - !appx: {name: 'Microsoft.Windows.Photos*', type: family}
  - !appx: {name: 'Microsoft.ScreenSketch*', type: family}
  - !appx: {name: 'Microsoft.Windows.DevHome*', type: family}

  # Xbox Game Bar registry cleanup (only when the Xbox option is chosen)
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: 'URL:ms-gamebar', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: 'URL Protocol', type: REG_SZ, data: '', option: "remove-appx-xbox"}
  - !registryKey: {path: 'HKCR\ms-gamebar\shell\open\command', operation: add, option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: '%SystemRoot%\System32\systray.exe', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCU\Software\Microsoft\GameBar', value: 'ShowStartupPanel', type: REG_DWORD, data: 0, option: "remove-appx-xbox"}

  # Clear AppX caches
  - !writeStatus: {status: 'Clearing AppX caches'}
  - !appx: {operation: clearCache, name: '*MicrosoftWindows.Client.CBS*'}
  - !appx: {operation: clearCache, name: '*Microsoft.Windows.Search*'}
  - !appx: {operation: clearCache, name: '*Microsoft.Windows.SecHealthUI*'}

  - !writeStatus: {status: 'Installing Browser'}
  - !powerShell:
    command: '.\software.ps1'
    exeDir: true
    wait: true
    weight: 150
    runas: currentUserElevated

    # Browsers
  - !writeStatus: {status: 'Installing Brave', option: 'browser-brave'}
  - !powerShell:
    command: '.\software.ps1 -Brave'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-brave'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing operagx', option: 'opera-gx'}
  - !powerShell:
    command: '.\software.ps1 -OperaGX'
    exeDir: true
    wait: true
    weight: 120
    option: 'opera-gx'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Google Chrome', option: 'browser-chrome'}
  - !powerShell:
    command: '.\software.ps1 -Chrome'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-chrome'
    runas: currentUserElevated

  - !writeStatus: {status: '✅ All bloatware removed successfully! GPU drivers and critical apps kept intact!'}
