title: Restore Point + Ultimate Performance power plan
description: Creates a safety restore point BEFORE any aggressive tweaks run (System Restore/VSS is disabled later by the ULTRA pass), then activates the Ultimate Performance power plan.
actions:
  - !writeStatus: {status: "Creating system restore point (safety net)..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\create_restore_point.ps1'

  - !writeStatus: {status: "Running power plan setup script..."}
  - !powerShell:
    exeDir: true
    wait: true
    command: '.\set_power_plan.ps1'
