title: Restore Point + Ultimate Performance power plan
description: Creates a safety restore point BEFORE any aggressive tweaks run (System Restore/VSS is disabled later by the ULTRA pass), then activates the Ultimate Performance power plan.
actions:
  - !writeStatus: {status: "Creating system restore point (safety net)..."}
  - !powerShell:
      wait: true
      command: |
        try {
          Enable-ComputerRestore -Drive "C:\" -ErrorAction SilentlyContinue
          Checkpoint-Computer -Description "Z-LAG OS - Pre-Optimization" -RestorePointType MODIFY_SETTINGS -ErrorAction Stop | Out-Null
          Write-Output "[Z-LAG] Restore point created."
        } catch {
          Write-Output "[Z-LAG] Restore point skipped (System Protection unavailable): $($_.Exception.Message)"
        }

  - !writeStatus: {status: "Running power plan setup script..."}
  - !powerShell:
    exeDir: true
    wait: true
    command: '.\set_power_plan.ps1'
