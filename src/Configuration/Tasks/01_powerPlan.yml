title: Previous-core reset + restore point + performance power plan
description: Aggressively removes executable artifacts and scheduled tasks from earlier Z-LAG builds before creating the safety restore point and activating the performance power plan. ProgramData logs/backups are retained.
actions:
  - !writeStatus: {status: "Removing previous Z-LAG executable core..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\reset_zlag_core.ps1'

  - !writeStatus: {status: "Creating system restore point (safety net)..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\create_restore_point.ps1'

  - !writeStatus: {status: "Running power plan setup script..."}
  - !powerShell:
    exeDir: true
    wait: true
    command: '.\set_power_plan.ps1'
