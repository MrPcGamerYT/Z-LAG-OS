title: Apply user-facing settings (dark mode / taskbar / start menu / input)
description: "Runs as the ACTIVE user (runas: currentUserElevated) because AME's !registryValue executes as TrustedInstaller, whose HKCU is the SYSTEM account's hive - so dark mode, taskbar and start-menu tweaks written there never reach the real user. This task applies them to the logged-in user and mirrors to HKU\\.DEFAULT for future accounts, then refreshes the shell."
actions:
  - !writeStatus: {status: "Applying user-facing settings (dark mode / taskbar / start menu)..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\apply_user_settings.ps1'
      runas: currentUserElevated
  - !powerShell:
      command: 'Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue; Start-Process explorer'
      runas: currentUserElevated
  - !writeStatus: {status: "User-facing settings applied."}
