title: Repairing AppX runtime and kept connectivity
description: Restores the AppX launch chain and, when Bluetooth Keep is selected, repairs the Bluetooth radio, pairing brokers, per-user services and disabled PnP devices after the aggressive service floor.
actions:
  - !writeStatus: {status: "Repairing AppX runtime for sideloaded apps..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\repair_appx_runtime.ps1'
  - !writeStatus: {status: "Repairing Bluetooth radio and Add Device services...", option: 'bluetooth-keep'}
  - !powerShell:
      option: 'bluetooth-keep'
      wait: true
      exeDir: true
      command: '.\repair_bluetooth.ps1'
  - !writeStatus: {status: "AppX runtime and selected connectivity are healthy."}
