title: Repairing AppX runtime (sideloaded apps / error -2147416359)
description: Restores LicenseManager, ClipSVC, AppXSvc, StateRepository and sideload policy so Z-LAG Toolbox installed apps launch without crashing. Bluetooth pairing dependencies are excluded from the global service floor instead of being repaired afterward.
actions:
  - !writeStatus: {status: "Repairing AppX runtime for sideloaded apps..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\repair_appx_runtime.ps1'
  - !writeStatus: {status: "AppX runtime healthy. Sideloaded apps will not crash on launch."}
