title: Advanced Performance Tweaks (Beyond Atlas)
actions:
  - !powerShell: {command: 'Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force'}
  # Memory compression stays ENABLED on purpose. Disabling it forces every
  # memory-pressure event into hard pagefile I/O, which is exactly the kind of
  # mid-game hitch/stutter this playbook must avoid. Compression costs a tiny
  # bit of CPU but prevents disk-bound frame drops on 8/16 GB systems.
  - !powerShell: {command: 'if (Get-Command Enable-MMAgent -ErrorAction SilentlyContinue) { try { Enable-MMAgent -MemoryCompression -ErrorAction SilentlyContinue } catch {} }; exit 0'}
  - !cmd: {command: 'fsutil behavior set disablelastaccess 1'}
  - !cmd: {command: 'fsutil behavior set disable8dot3 1'}
  - !powerShell: {command: 'Get-ChildItem "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces" | ForEach-Object { Set-ItemProperty -Path $_.PSPath -Name "TCPNoDelay" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue }'}
  - !cmd: {command: 'netsh int tcp set global autotuninglevel=normal'}
  
  - !powerShell:
      exeDir: true
      command: '.\set_smooth_mouse.ps1'
      runas: currentUserElevated
  
  - !powerShell: {command: 'try { Optimize-Volume -DriveLetter ($env:SystemDrive.TrimEnd(":")) -ReTrim -ErrorAction Stop | Out-Null } catch {}; exit 0'}

  # Fixed-size pagefile (initial = maximum, clamp(RAM, 4-16 GB) on the system
  # drive). The auto-managed pagefile grows in ~100 MB chunks under RAM
  # pressure - each growth is synchronous disk I/O that lands mid-frame and
  # reads as a random hitch in games/emulators. Skips cleanly when the disk
  # is too small or a user-fixed pagefile already exists.
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\set_pagefile.ps1'

  - !cmd: {command: 'ipconfig /flushdns'}
  - !cmd: {command: 'ipconfig /registerdns'}
