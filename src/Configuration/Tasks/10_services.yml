title: Disabling services
description: Disables resource-hogging background services using AME's native service action (reversible). A backup of the current service configuration is exported first.
privilege: TrustedInstaller
onUpgrade: false
actions:
  # Back up current service configuration so the change can be reverted.
  - !writeStatus: {status: "Backing up current service configuration..."}
  - !powerShell: {command: 'New-Item -ItemType Directory -Force "$env:ProgramData\Z-LAG-OS" -ErrorAction SilentlyContinue | Out-Null; reg export "HKLM\SYSTEM\CurrentControlSet\Services" "$env:ProgramData\Z-LAG-OS\services_backup.reg" /y'}

  # NOTE: wlidsvc (Microsoft Account Sign-in Assistant) is intentionally NOT
  # touched - disabling it makes sideloaded apps fail with "The service has not
  # been started".

  # startup: 4 = Disabled, 3 = Manual (available on demand, 0 at idle)
  - !service: {name: 'DiagTrack', operation: change, startup: 4}
  - !service: {name: 'dmwappushservice', operation: change, startup: 4}
  - !service: {name: 'WerSvc', operation: change, startup: 4}
  - !service: {name: 'PcaSvc', operation: change, startup: 4}
  - !service: {name: 'SysMain', operation: change, startup: 4}
  - !service: {name: 'WSearch', operation: change, startup: 4}
  - !service: {name: 'WbioSrvc', operation: change, startup: 4}
  - !service: {name: 'MapsBroker', operation: change, startup: 4}
  - !service: {name: 'Fax', operation: change, startup: 4}
  - !service: {name: 'XblAuthManager', operation: change, startup: 4}
  - !service: {name: 'XblGameSave', operation: change, startup: 4}
  - !service: {name: 'XboxNetApiSvc', operation: change, startup: 4}
  - !service: {name: 'XboxGipSvc', operation: change, startup: 4}
  - !service: {name: 'RetailDemo', operation: change, startup: 4}
  - !service: {name: 'RemoteRegistry', operation: change, startup: 4}

  # Legacy/on-demand services that Windows can trigger-start again after boot.
  # RpcLocator is the optional Locator service, NOT the core RpcSs service.
  - !service: {name: 'VSS', operation: change, startup: 4}
  - !service: {name: 'SwPrv', operation: change, startup: 4}
  - !service: {name: 'RpcLocator', operation: change, startup: 4}
  - !service: {name: 'SNMPTRAP', operation: change, startup: 4}
  - !service: {name: 'vds', operation: change, startup: 4}
  - !service: {name: 'WMPNetworkSvc', operation: change, startup: 4}
  - !service: {name: 'ssh-agent', operation: change, startup: 4}
  - !service: {name: 'MSDTC', operation: change, startup: 4}
  - !service: {name: 'SDRSVC', operation: change, startup: 4}
  - !service: {name: 'smphost', operation: change, startup: 4}
  - !service: {name: 'wbengine', operation: change, startup: 4}

  - !service: {name: 'UsoSvc', operation: change, startup: 4}
  - !service: {name: 'BDESVC', operation: change, startup: 4}
  - !service: {name: 'iphlpsvc', operation: change, startup: 3}
  - !service: {name: 'ShellHWDetection', operation: change, startup: 3}
  # CDPSvc is untouched because Bluetooth Add Device depends on it.
  - !service: {name: 'PhoneSvc', operation: change, startup: 4}
  - !service: {name: 'Spooler', operation: change, startup: 4}
  - !service: {name: 'TrkWks', operation: change, startup: 4}
  # TabletInputService/TextInputHost is part of the text-input stack. Fully
  # disabling it broke keyboard input in UWP/search surfaces for some users, so
  # it is demand-start (0 footprint at idle, still available when needed).
  - !service: {name: 'TabletInputService', operation: change, startup: 3}
  - !service: {name: 'StiSvc', operation: change, startup: 4}
  - !service: {name: 'wisvc', operation: change, startup: 4}
  - !service: {name: 'SensorDataService', operation: change, startup: 4}
  - !service: {name: 'SensorService', operation: change, startup: 4}
  - !service: {name: 'SensrSvc', operation: change, startup: 4}
  - !service: {name: 'WpnService', operation: change, startup: 4}
  - !service: {name: 'BcastDVRUserService', operation: change, startup: 4}
  - !service: {name: 'OneSyncSvc', operation: change, startup: 4}
  - !service: {name: 'UserDataSvc', operation: change, startup: 4}
  - !service: {name: 'UnistoreSvc', operation: change, startup: 4}
  - !service: {name: 'PimIndexMaintenanceSvc', operation: change, startup: 4}
  - !service: {name: 'MessagingService', operation: change, startup: 4}
  - !service: {name: 'wuauserv', operation: change, startup: 4}
  - !service: {name: 'WaaSMedicSvc', operation: change, startup: 4}
