title: Remove Microsoft Edge and WebView2 completely
description: Downloads the requested ShadowWhisperer setup.exe only when its pinned SHA-256 matches, force-uninstalls Edge/WebView2, then runs the authoritative PowerShell cleanup for system/per-user hives, AppX/provisioning, processes, services, tasks, files, shortcuts, update clients and registry integration. Apps that require WebView2 must provide or reinstall their own runtime.
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Downloading and verifying the pinned Edge setup remover..."}
  - !cmd: {command: 'edge_remover.bat', exeDir: true}
  - !writeStatus: {status: "Running authoritative all-user Edge/WebView2 cleanup..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\remove_edge.ps1'
  - !writeStatus: {status: "Microsoft Edge and WebView2 Runtime removed."}
