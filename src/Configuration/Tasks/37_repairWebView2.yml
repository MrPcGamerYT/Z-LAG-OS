title: WebView2 Runtime Guarantee (final health check)
description: Final idempotent check that the WebView2 Runtime is present after all removal passes. Reinstalls the official Evergreen WebView2 Runtime silently if it is missing, so WebView2-dependent apps never throw "WebView2 runtime missing".
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Final WebView2 Runtime health check..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\repair_webview2.ps1'
  - !writeStatus: {status: "WebView2 Runtime guaranteed."}
