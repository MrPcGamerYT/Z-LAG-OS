title: Native boot status and verified Opti Services host
description: Compiles and validates a native WinForms Z LAG Opti Services host using full .NET Framework paths, PE/identity checks, three pre-install launch tests and one installed-file test. No WPF/System.Xaml, VBS, PowerShell panel script or fallback launcher is used.
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Configuring secure-screen loading status..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\configure_boot_welcome.ps1'
  - !writeStatus: {status: "Verified Z LAG Opti Services host installed."}
