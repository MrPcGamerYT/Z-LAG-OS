title: Native boot status and post-boot Welcome panel
description: Keeps status text on the secure Windows Welcome screen, then runs the compiled native Z LAG Opti Services host after Explorer loads. No VBS, PowerShell panel script, process list or post-login boot status is used.
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Configuring lock-screen loading status and Welcome-only post-boot panel..."}
  - !powerShell:
      wait: true
      exeDir: true
      command: '.\configure_boot_welcome.ps1'
  - !writeStatus: {status: "Native boot status and Z LAG Opti Services host configured."}
