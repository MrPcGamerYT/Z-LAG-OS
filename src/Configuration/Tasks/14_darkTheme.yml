title: "Configure Z-LAG OS Personalization & Themes"
description: "Sets dark mode for Windows and apps (current user + default user), plus custom dark mouse cursor. All user-level changes run as the active user so they apply on first run."
actions:
  - !writeStatus: {status: "Enabling dark mode..."}

  # Dark mode for apps (UWP/modern) + system chrome. run as the active user so
  # HKCU actually lands in the logged-in user's hive (TrustedInstaller's HKCU
  # would be the SYSTEM account's hive and change nothing for the user).
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'AppsUseLightTheme'
      data: '0'
      type: REG_DWORD
      runas: currentUserElevated

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'SystemUsesLightTheme'
      data: '0'
      type: REG_DWORD
      runas: currentUserElevated

  # Also bake dark mode into the Default User template for future accounts.
  - !registryValue:
      path: 'HKU\.DEFAULT\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'AppsUseLightTheme'
      data: '0'
      type: REG_DWORD
  - !registryValue:
      path: 'HKU\.DEFAULT\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'SystemUsesLightTheme'
      data: '0'
      type: REG_DWORD

  # Set custom dark mouse cursor (runs your existing script with admin rights)
  - !powerShell:
      command: .\set_dark_mousecursor.ps1
      exeDir: true
      wait: true
      runas: currentUserElevated

  # Refresh Explorer in the user's session to apply changes immediately
  - !powerShell:
      command: 'Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue; Start-Process explorer'
      runas: currentUserElevated
