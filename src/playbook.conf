<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Z LAG OS</Name>
    <Username>ZERO LAG</Username>
    <ShortDescription>Maximum FPS and zero lag gaming for Windows 10/11</ShortDescription>
    <Title>Z LAG OS - Zero Lag Gaming Operating System</Title>
    <Description><![CDATA[
Target: Maximum FPS and Zero Lag Experience
ULTRA process + RAM floor: VSS/System Restore, notifications, network
discovery, file sharing and hotspot are fully disabled for gaming
An expanded non-resident service watchdog prevents Windows extras returning
Universal: works on Windows 10 AND Windows 11
]]></Description>
    <Details>Zero Lag, Max Performance. Dev By - Z LAG Community.</Details>
    <Version>5.14</Version>
    <Requirements>
        <Requirement>Internet</Requirement>
        <Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
        <Requirement>FreshInstall</Requirement>
    </Requirements>
    <UniqueId>ff01afe4-21fb-46db-bb07-fc89c1cef47c</UniqueId>
	<Git>https://github.com/MrPcGamerYT/Z-LAG-OS</Git>
    <Overhaul>true</Overhaul>
    <EstimatedMinutes>60</EstimatedMinutes>
    <FeaturePages>
        <RadioImagePage CheckDefaultBrowser="true" DependsOn="software"
            DefaultOption="browser-chrome" IsRequired="true"
            Description="Please select a preferred browser. We can only provide a curated experience for some options.">
            <Options>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#057DB6</GradientTopColor>
					<GradientBottomColor>#86D8FF</GradientBottomColor>
				</RadioImageOption>
                <RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#131524</GradientTopColor>
					<GradientBottomColor>#3b3e4f</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>OperaGX</Text>
					<Name>opera-gx</Name>
					<FileName>operagx</FileName>
					<GradientTopColor>#000004</GradientTopColor>
					<GradientBottomColor>#700009</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>None</Text>
					<Name>none</Name>
					<FileName>none</FileName>
					<GradientTopColor>#7E7E7E</GradientTopColor>
					<GradientBottomColor>#D0D0D0</GradientBottomColor>
				</RadioImageOption>
			</Options>
            <BottomLine Text="Privacy comparison" Link="https://privacytests.org/" />
        </RadioImagePage>
         <RadioPage IsRequired="true" DefaultOption="defender-keep" Description="Disabling Defender reduces security, and is an option for advanced users only.">
            <TopLine Text="⚠️ WARNING: Disabling Defender leaves your system vulnerable to malware."/>
            <Options>
                <RadioOption>
                    <Text>Keep Windows Defender (recommended)</Text>
                    <Name>defender-keep</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Windows Defender (Max Performance)</Text>
                    <Name>defender-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>
		<!-- NEW BLUETOOTH PAGE -->
        <RadioPage IsRequired="true" DefaultOption="bluetooth-keep" Description="Disabling Bluetooth stops background scanning services. Only disable if you use wired mice/keyboards/headsets.">
            <TopLine Text="Bluetooth Configuration"/>
            <Options>
                <RadioOption>
                    <Text>Keep Bluetooth enabled (Recommended)</Text>
                    <Name>bluetooth-keep</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Bluetooth completely (Max Performance)</Text>
                    <Name>bluetooth-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- NEW WI-FI PAGE -->
        <RadioPage IsRequired="true" DefaultOption="wifi-keep" Description="Disabling Wi-Fi frees up RAM and network scanning interrupts. ONLY disable this if you are plugged in via Ethernet cable.">
            <TopLine Text="Wi-Fi / WLAN Configuration"/>
            <Options>
                <RadioOption>
                    <Text>Keep Wi-Fi enabled (Recommended)</Text>
                    <Name>wifi-keep</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Wi-Fi completely (Ethernet Users Only)</Text>
                    <Name>wifi-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- NEW MICROSOFT STORE & SERVICES PAGE -->
        <RadioPage IsRequired="true" DefaultOption="store-keep" Description="Disabling Microsoft Store and Microsoft cloud/identity services frees up maximum RAM, CPU cycles, and background network traffic.">
            <TopLine Text="Microsoft Store &amp; Microsoft Services Configuration"/>
            <Options>
                <RadioOption>
                    <Text>Keep Microsoft Store &amp; Services enabled (Recommended)</Text>
                    <Name>store-keep</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Remove Microsoft Store &amp; All MS Services (Max Performance)</Text>
                    <Name>store-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>
    </FeaturePages>
</Playbook>
